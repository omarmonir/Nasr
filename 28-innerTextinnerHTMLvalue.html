<html lang="en">

           - Gets or sets HTML content
           - Parses HTML tags

        3️⃣ outerHTML
           - Gets or replaces the element itself with its HTML
        */

        // Reads only the text inside the div

        // document.getElementsByTagName("div")[0].innerHTML

            ==============================
            SELECTING ELEMENTS

            */

            // Select input element of type text
            var userinput = document.querySelector("input[type=text]");

            /*
            ==============================
            INPUT ELEMENT PROPERTIES
            ==============================

            - value     → gets user input
            - innerText → NOT used with input
            - innerHTML → NOT used with input
            */

            // console.log(userinput.innerText); ❌ undefined
            // console.log(userinput.value);     ✅ correct

            // Change input value
            // document.querySelector("input[type=text]").value = "Mansoura";

            // ❌ div elements do NOT have value property
            // document.querySelector("div").value = "Alex";

            /*
            ==============================
            ADD USER INPUT INTO DIV
            ==============================
            */

            // Add text (as plain text)
            // document.getElementsByTagName("div")[0].innerText += "\n\n" + userinput.value;

            // Add text (as HTML)
            // document.getElementsByTagName("div")[0].innerHTML += userinput.value;

            /*
            ==============================
            outerHTML
            ==============================
            */

            // document.getElementsByTagName("p")[0].outerHTML
            // Returns the <p> element itself including its tag
        }
    </script>
</head>

<body>
    <!-- Input field to enter text -->
    <input type="text">

    <!-- Button that triggers myfunc() -->
    <input type="button" value="Add" onclick="myfunc()">

    <!--
    Div element used as a container
    Content inside it will be manipulated using DOM
    -->
    <div id="mainwrapper">
        information technology institute
        <p>ITI Mansoura</p>

</body>
</html>
